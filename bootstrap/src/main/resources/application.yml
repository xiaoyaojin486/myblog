server:
  port: 8080
  servlet:
    context-path: /api          # 统一接口前缀；Controller 路径不再重复写 /api
  tomcat:
    threads:
      max: 200
      min-spare: 10

spring:
  application:
    name: myblog
  profiles:
    active: dev                 # 本地开发 dev，部署改 prod
  config:
    import: optional:file:./.env[.properties]   # 加载 .env（相对运行工作目录，同名系统环境变量优先级更高）

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:myblog}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 3000ms

  servlet:
    multipart:
      max-file-size: 10MB        # 单文件上限（图片）
      max-request-size: 20MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.myblog.**.entity
  configuration:
    map-underscore-to-camel-case: true   # 下划线转驼峰
    cache-enabled: false

pagehelper:
  helper-dialect: mysql
  reasonable: true               # 页码越界自动纠正
  support-methods-arguments: true
  params: count=countSql

# 阿里云 OSS（值来自 .env / 系统环境变量）
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: ${OSS_BUCKET_NAME}
    domain: ${OSS_DOMAIN:}
    dir-prefix: myblog/

# JWT
jwt:
  secret: ${JWT_SECRET}
  expire-hours: ${JWT_EXPIRE_HOURS:24}
  header: Authorization
  token-prefix: "Bearer "

# 管理员初始账号（首次启动自动创建）
admin:
  init-password: ${ADMIN_INIT_PASSWORD:admin123}

# 接口文档
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
  setting:
    language: zh_cn

# 日志
logging:
  file:
    name: logs/myblog.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7