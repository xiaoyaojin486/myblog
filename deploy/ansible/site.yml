---
# ========== 第一步：前置检查（失败就立刻停，给你清楚的报错）==========
- name: 部署前置检查
  hosts: myblog
  gather_facts: false
  tasks:
    - name: 检查 Docker 是否可用
      ansible.builtin.command: docker --version
      changed_when: false

    # ★ v2：v1 在这里查「myapp 网络 / myapp-mysql 容器 / tlias 库」，
    #   那三项存在的唯一目的是确认「借来的东西还在」。现在不借了，它们自然消失。
    #   空出来的位置放一条真正有用的检查：8081 被谁占着。
    - name: 看看 8081 端口被哪个容器占着
      ansible.builtin.shell: >-
        docker ps --format {% raw %}'{{.Names}} {{.Ports}}'{% endraw %}
        | grep ':{{ myblog_port }}->' || true
      changed_when: false
      register: port_owner

    - name: 端口检查
      # 第二次跑 playbook 时，8081 被自己的 myblog-nginx 占着是正常的；
      # 被别的容器占着才是问题 —— 这条断言自己分辨这两种情况。
      ansible.builtin.assert:
        that:
          - port_owner.stdout == '' or 'myblog-nginx' in port_owner.stdout
        fail_msg: >-
          {{ myblog_port }} 端口被「{{ port_owner.stdout }}」占着，
          先把它停掉或换个端口，再跑这个 playbook。
        success_msg: >-
          {{ myblog_port }} 端口可用（占用者：{{ port_owner.stdout | default('无', true) }}）

# ========== 第二步：正式初始化 ==========
- name: 初始化博客服务器
  hosts: myblog
  roles:
    - docker
    - myblog-init
