---
# ========== 第一步：前置检查（失败就立刻停，给你清楚的报错）==========
- name: 部署前置检查
  hosts: myblog
  gather_facts: false
  tasks:
    - name: 检查 Docker 是否可用
      ansible.builtin.command: docker --version
      changed_when: false

    # ★ v2：v1 在这里查「myapp 网络 / myapp-mysql 容器 / tlias 库」，
    #   那三项存在的唯一目的是确认「借来的东西还在」。现在不借了，它们自然消失。
    #   空出来的位置放一条真正有用的检查：myblog_port 被谁占着。
    - name: 看看 {{ myblog_port }} 端口被哪个容器占着
      ansible.builtin.shell: >-
        docker ps --format {% raw %}'{{.Names}} {{.Ports}}'{% endraw %}
        | grep ':{{ myblog_port }}->' || true
      changed_when: false
      register: port_owner

    - name: 端口检查
      # 第二次跑 playbook 时，myblog_port 被自己的 myblog-nginx 占着是正常的；
      # 被别的容器占着才是问题 —— 这条断言自己分辨这两种情况。
      ansible.builtin.assert:
        that:
          - port_owner.stdout == '' or 'myblog-nginx' in port_owner.stdout
        fail_msg: >-
          {{ myblog_port }} 端口被「{{ port_owner.stdout }}」占着，
          先把它停掉或换个端口，再跑这个 playbook。
        success_msg: >-
          {{ myblog_port }} 端口可用（占用者：{{ port_owner.stdout | default('无', true) }}）

# ========== 第二步：正式初始化 ==========
- name: 初始化博客服务器
  hosts: myblog
  roles:
    - docker
    # ★ 系统日志：给 journald 设容量上限 + 让它落盘持久化。
    #   和 docker 挨着放，是因为这两个是【同一件事的两半】：
    #   docker 的 daemon.json 管容器日志轮转，这里管主机 systemd 日志 ——
    #   两套存储互不相通，摆在一起不容易改错地方（见 日志方案.md §5.7）。
    - journald
    - myblog-init
    # ★ 数据库备份：装 ossutil、写 OSS 凭据、起每日备份的 systemd 定时器。
    #   备份脚本本体由 CI 投递（同 rollback.sh），不在这里。
    - myblog-backup
