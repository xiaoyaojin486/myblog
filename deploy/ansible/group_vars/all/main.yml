---
# ===== 路径与端口 =====
myblog_root: /opt/myblog
myblog_port: 8081

# ===== Docker 镜像加速器（已填入当前可用地址）=====
docker_registry_mirrors:
  - "https://docker.1panel.live/"
  - "https://docker.m.daocloud.io/"
  - "https://docker.xuanyuan.me/"
  - "https://docker.1ms.run/"

# ===== 需要预拉的基础镜像 =====
# ★ v2：补上 redis 和 mysql —— v1 漏了这两个，全靠 compose 现场拉，
#         换个网络环境就是「首次部署卡在拉镜像」。
base_images:
  - eclipse-temurin:21-jre
  - nginx:alpine
  - redis:7-alpine
  - mysql:8.0

# ===== 博客自己的数据库 =====
# ★ v2：不再有 myapp_network（外部网络），容器名也换成了自己的
mydb_container: myblog-mysql
mydb_name: myblog
mydb_user: myblog

# ===== 数据库备份（见 deploy/备份与恢复手册.md）=====
# 备份脚本 /opt/myblog/backup.sh 由 CI 投递，它自己管保留天数（KEEP_DAYS）。
# 这里只管"主机侧"的三样东西：
backup_dir: "{{ myblog_root }}/backup"   # 备份落点 + OSS 凭据所在目录
ossutil_version: "1.7.18"                # v1 最后版本（2023-10-30 后停更）；装成 ossutil-<版本> + 软链，方便回退
oss_backup_bucket: "{{ vault_oss_backup_bucket }}"   # 备份专用桶，和博客文件桶分开

# ===== 项目根目录（用于定位 sql/init.sql）=====
# ★★ 必须是绝对路径！
#   playbook 跑在 ~/ansible（WSL 家目录），跟仓库没有相对关系了。
#   写 "{{ playbook_dir }}/../.." 会算成 /home，Ansible 直接报找不到文件。
#   （v1 的仓库快照里就残留着这个旧写法，v2 一并修正。）
project_root: "{{ playbook_dir }}/../.."
