# Ansible 主配置文件
# 查找顺序：ANSIBLE_CONFIG 环境变量 -> 当前目录 ansible.cfg -> ~/.ansible.cfg -> /etc/ansible/ansible.cfg

[defaults]
# 指定默认使用的 inventory 文件。
# 这样运行 ansible / ansible-playbook 时，不写 -i 也会自动加载 inventory.ini。
inventory           = inventory.ini

# 关闭 SSH 主机密钥检查。
# 首次 SSH 连接目标主机时，不再提示确认指纹，直接连接。
# 学习环境图省事；生产建议用 ssh-keyscan 把目标主机指纹写入 known_hosts，避免中间人攻击。
host_key_checking   = False

# 禁用失败重试文件。
# Ansible 默认在 playbook 失败后生成 .retry 文件，记录失败主机，方便用 --limit @xxx.retry 重试。
# 设为 False 后不再生成这些文件，保持目录干净。
retry_files_enabled = False

# 标准输出回调插件设为 yaml。
# 任务结果会以 YAML 格式展示，结构更清晰、更好读。
# 其他常见值：default、minimal、oneline、json 等。
stdout_callback     = default
result_format       = yaml

# 控制目标主机上 Python 解释器的探测方式。
# auto_silent：自动探测目标机的 Python，但不打印警告信息。
# 注意：inventory 中主机/组变量 ansible_python_interpreter 的优先级高于此配置。
interpreter_python  = auto_silent

[privilege_escalation]
# 默认不启用提权（相当于 sudo / su）。
# 因为 inventory 中 ansible_user=root，直接用 root 连接，本身已是最高权限，不需要再提权。
become = False
