---
# ★ v2：从 5 个任务砍到 3 个。
#   v1 里那 4 个「docker exec myapp-mysql ... 建库/建账号/建表/验证」的任务全部删掉了 ——
#   因为容器不是我们的，只能钻进去手动补。现在 myblog-mysql 是我们自己的容器，
#   官方镜像靠环境变量 + docker-entrypoint-initdb.d 在首次启动时自动完成。
#   还有 1 个「确认 tlias 库还在」的安全检查也删了 —— 我们碰都碰不到它。

- name: 创建博客目录结构
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ myblog_root }}"
    - "{{ myblog_root }}/backend"
    - "{{ myblog_root }}/frontend"
    - "{{ myblog_root }}/nginx"
    - "{{ myblog_root }}/sql"
    - "{{ myblog_root }}/logs"
    - "{{ myblog_root }}/redis-data"
    - "{{ myblog_root }}/mysql-data"      # ★ v2 新增

- name: 上传建表脚本（MySQL 容器首次启动时自动执行它）
  # ⚠️ 必须在第一次 `docker compose up -d` 之前传上去。
  #    文件不存在时 Docker 会把挂载点建成「目录」，MySQL 就会静默地不建表。
  ansible.builtin.copy:
    src: "{{ project_root }}/sql/init.sql"
    dest: "{{ myblog_root }}/sql/init.sql"
    mode: "0644"

- name: 渲染 .env（密钥来自 Vault）
  ansible.builtin.template:
    src: env.j2
    dest: "{{ myblog_root }}/.env"
    mode: "0600"
