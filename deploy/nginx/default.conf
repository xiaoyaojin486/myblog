server {
    listen 80;
    server_name _;                      # 没域名，用 IP:8081 直连
    root /usr/share/nginx/html;
    index index.html;

    # ★ 图片上传：nginx 默认只放行 1MB，超了直接 413 拒掉，
    #   请求根本到不了后端。前端拦截器把非 401 的错误一律显示成
    #   「网络异常」，所以看起来像网络故障，实际是这里。
    #   10m 跟 spring.servlet.multipart.max-file-size 对齐。
    client_max_body_size 10m;

    # ★ 前端是 history 路由，没这行刷新子页面会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ★ 关键：容器重建后 IP 会变，没这行重新部署后必然 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend$request_uri;   # 保留完整路径（后端 context-path 就是 /api）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端产物带 hash，长缓存；index.html 不缓存，避免发版后拿到旧页面
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
